<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="./Image icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FF5200" />
    
    <!-- SEO Primary Meta Tags -->
    <title>CraveCart – Fast, Fresh Food Delivery & Live Tracking Platform</title>
    <meta
      name="description"
      content="Order your favourite food online with CraveCart. Enjoy lightning-fast delivery, 3D live GPS tracking, exclusive restaurant offers, and our smart AI food assistant."
    />
    <meta name="keywords" content="food delivery, biryani, pizza, online restaurant, live order tracking, Swiggy alternative, Zomato alternative, CraveCart" />
    <meta name="author" content="CraveCart Technologies" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cravecart.com/" />
    <meta property="og:title" content="CraveCart – Fast, Fresh Food Delivery Platform" />
    <meta property="og:description" content="Discover restaurants, order delicious food, and track deliveries in real time with CraveCart." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1200" />

    <!-- Twitter Cards -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="CraveCart – Fast, Fresh Food Delivery" />
    <meta property="twitter:description" content="Delicious meals delivered to your doorstep in minutes." />
    <meta property="twitter:image" content="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1200" />

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FoodEstablishment",
        "name": "CraveCart",
        "description": "On-demand food delivery connecting local kitchens with hungry customers.",
        "url": "https://cravecart.com",
        "servesCuisine": ["North Indian", "Biryani", "Fast Food", "Pizza", "South Indian", "Chinese"],
        "priceRange": "₹₹",
        "paymentAccepted": ["Cash", "Credit Card", "UPI", "Net Banking"]
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- MapLibre GL CSS -->
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run CraveCart food delivery app.</noscript>
    <div id="root"></div>
  </body>
</html>
